{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Morpho</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card sombra_cards border-0">
          <div class="card-body p-4">

            <div class="text-center mb-3">
              <img src="{% static 'img/logo-morpho-automacao-contabil.png' %}" alt="Logo" width="56" height="56">
              <div class="fw-bold mt-2">Morpho</div>
              <div class="text-secondary small">Análise Tributária</div>
            </div>

            <h5 class="mb-3">Entrar</h5>

            {% if form.errors %}
              <div class="alert alert-danger py-2 small">
                Usuário ou senha inválidos.
              </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
              {% csrf_token %}

              <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="text" name="username" class="form-control" autocomplete="username" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control" autocomplete="current-password" required>
              </div>

              <input type="hidden" name="next" value="{{ next }}">

              <button class="btn btn-dark w-100" type="submit">
                <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
              </button>
            </form>

            <div class="text-center text-secondary small mt-3">
              Acesso criado pelo administrador.
            </div>

          </div>
        </div>

        <div class="text-center text-secondary small mt-3">
          © {% now "Y" %} Morpho Automações
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script>
    {% if messages %}
      {% for message in messages %}
        {% if 'html' not in message.tags %}
          Toastify({
            text: "{{ message|escapejs }}",
            duration: 4000,
            gravity: "top",
            position: "right",
            backgroundColor: "{% if 'error' in message.tags %}#dc3545{% elif 'success' in message.tags %}#198754{% else %}#0d6efd{% endif %}",
            stopOnFocus: true,
          }).showToast();
        {% endif %}
      {% endfor %}
    {% endif %}
  </script>
</body>
</html>
